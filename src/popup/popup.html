<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude PR Link</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon32.png" width="20" height="20" alt="" />
      <h1>Claude Code ↔ PRs</h1>
      <button id="sync" type="button" class="primary">Sync now</button>
    </header>

    <p id="status" class="status" role="status"></p>

    <input id="filter" type="search" placeholder="Filter by repo, PR number or session title" autocomplete="off" />

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>
      No links yet. Open <a href="https://claude.ai/code" target="_blank" rel="noopener">claude.ai/code</a> or press
      <b>Sync now</b> to read your sessions.
    </p>

    <details class="settings">
      <summary>Settings</summary>
      <label><input type="checkbox" id="autoSync" /> Sync automatically while claude.ai is open</label>
      <label>
        Sync every
        <input type="number" id="syncIntervalMinutes" min="5" max="1440" step="5" />
        minutes
      </label>
      <label><input type="checkbox" id="matchBranch" /> Match PRs by the branch a session pushed to</label>
      <label><input type="checkbox" id="showMentioned" /> Also link sessions that only mention a PR</label>
      <div class="row">
        <button id="export" type="button">Export JSON</button>
        <button id="clear" type="button" class="danger">Clear data</button>
      </div>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
